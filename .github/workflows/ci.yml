name: 🧪 测试

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 获取项目代码
        uses: actions/checkout@v5

      - name: 🛠️ 配置 .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: 🧪 集控服务端测试
        run: dotnet run --project ./tests/ServerLogic/ServerLogic.csproj -c Release --nologo
